plugins {
    id 'com.android.application'
}

android {
    namespace 'com.calmatrixoffline'
    compileSdk 34

    defaultConfig {
        applicationId "com.calmatrixoffline"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    //signing block
    // ADD THIS BLOCK
    signingConfigs {
        release {
            storeFile file("C:/CalSnapKeys/my-release-key.jks")
            storePassword "aa84009400"
            keyAlias "myalias"
            keyPassword "aa84009400"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release    // ADD THIS
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    //

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    //implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    //implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // REMOVE this line:
    // implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // ADD this line:
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    // Use the current TensorFlow Lite dependency
    //implementation 'org.tensorflow:tensorflow-lite:2.16.1' // Or a later version
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    // Optional: Support library for easier input/output handling
    // implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.opencsv:opencsv:5.9'

    implementation 'com.google.android.material:material:1.9.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'



}